<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>NullProof — Private DeFi Compliance</title>
    <meta
      name="description"
      content="Generate a zero-knowledge proof that your wallet is not on the OFAC sanctions list, without revealing the wallet address."
    />
    <meta
      name="theme-color"
      content="#050816"
    />
    <meta
      name="color-scheme"
      content="dark"
    />

    <meta property="og:title" content="NullProof — Private DeFi Compliance" />
    <meta
      property="og:description"
      content="ZK compliance proofs for DeFi. Verify non-membership in the OFAC sanctions list without revealing your wallet."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-cover.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NullProof — Private DeFi Compliance" />
    <meta
      name="twitter:description"
      content="Generate private compliance proofs locally in the browser."
    />
    <meta name="twitter:image" content="/og-cover.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Helps some browsers and extensions understand isolation intent.
         Real SharedArrayBuffer support still depends on server headers from Vite config. -->
    <meta
      http-equiv="Cross-Origin-Opener-Policy"
      content="same-origin"
    />
    <meta
      http-equiv="Cross-Origin-Embedder-Policy"
      content="require-corp"
    />

    <style>
      html {
        background: #050816;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(34, 197, 94, 0.08), transparent 30%),
          #050816;
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .app-boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .app-boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      .app-boot__mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid rgba(34, 197, 94, 0.32);
        background: rgba(34, 197, 94, 0.08);
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.10);
        position: relative;
      }

      .app-boot__mark::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 8px;
        border: 2px solid #22c55e;
      }

      .app-boot__title {
        margin: 0;
        color: #f8fafc;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .app-boot__subtitle {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .app-boot__bar {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
      }

      .app-boot__bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #22c55e, transparent);
        animation: nullproof-boot 1.35s linear infinite;
      }

      @keyframes nullproof-boot {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot__inner">
          <div class="app-boot__mark"></div>
          <p class="app-boot__subtitle">ZK Compliance Infrastructure</p>
          <h1 class="app-boot__title">Loading NullProof</h1>
          <div class="app-boot__bar"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
